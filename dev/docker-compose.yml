# Local WordPress for developing and testing the plugin. Never used on the live site.
# Start with ./dev/setup.sh (creates the site, activates the plugin, seeds fictional data).
name: sbr-dev
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-dev-only
      MARIADB_ROOT_PASSWORD: root-dev-only
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-dev-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - ../scholars-bowl-registration:/var/www/html/wp-content/plugins/scholars-bowl-registration
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-dev-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../scholars-bowl-registration:/var/www/html/wp-content/plugins/scholars-bowl-registration
volumes:
  db:
  wp:
